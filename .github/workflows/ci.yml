name: CI

on:
  push:
    branches: [ main, master, develop ]
  # Every PR, whatever its base, so stacked PRs get CI too.
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Go ${{ matrix.go }}, Core ${{ matrix.core }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
            core: '32.1'
          - os: ubuntu-latest
            go: stable
            core: '31.2'
          - os: ubuntu-latest
            go: stable
            core: '30.4'
          # The minimum Go in go.mod; stable/oldstable alone would never test it.
          - os: ubuntu-latest
            go: '1.25'
            core: '32.1'
          - os: macos-latest
            go: stable
            core: '32.1'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        cache: true

    - name: Install Bitcoin Core
      run: |
        V="${{ matrix.core }}"
        if [ "${{ runner.os }}" = "Linux" ]; then
          ARCH=x86_64-linux-gnu
        else
          ARCH=arm64-apple-darwin
        fi
        BASE="https://bitcoincore.org/bin/bitcoin-core-${V}"
        curl -sSfLO "${BASE}/SHA256SUMS"
        curl -sSfLO "${BASE}/bitcoin-${V}-${ARCH}.tar.gz"
        if [ "${{ runner.os }}" = "Linux" ]; then
          grep "bitcoin-${V}-${ARCH}.tar.gz" SHA256SUMS | sha256sum -c -
        else
          grep "bitcoin-${V}-${ARCH}.tar.gz" SHA256SUMS | shasum -a 256 -c -
        fi
        tar xzf "bitcoin-${V}-${ARCH}.tar.gz"
        echo "${GITHUB_WORKSPACE}/bitcoin-${V}/bin" >> "$GITHUB_PATH"

    - name: Verify Bitcoin Core installation
      run: |
        which bitcoind
        bitcoind --version

    - name: Install development tools
      run: make install-tools

    - name: Run the gate
      run: make gate

    - name: Run govulncheck
      # Module-level check: once is enough, on the newest Go.
      if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable' && matrix.core == '32.1'
      run: make vuln

    - name: Generate coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable' && matrix.core == '32.1'
      run: |
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Coverage Percentage" >> $GITHUB_STEP_SUMMARY
        COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
        echo "**Total Coverage: ${COVERAGE}%**" >> $GITHUB_STEP_SUMMARY

    - name: Upload coverage artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable' && matrix.core == '32.1'
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: coverage.out
        retention-days: 30
