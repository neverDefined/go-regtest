name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # publish GitHub releases

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # goreleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: true

      - name: Install Bitcoin Core
        # Same pinned, checksum-verified install as CI (ci.yml).
        env:
          V: '32.1'
          ARCH: x86_64-linux-gnu
        run: |
          BASE="https://bitcoincore.org/bin/bitcoin-core-${V}"
          curl -sSfLO "${BASE}/SHA256SUMS"
          curl -sSfLO "${BASE}/bitcoin-${V}-${ARCH}.tar.gz"
          grep "bitcoin-${V}-${ARCH}.tar.gz" SHA256SUMS | sha256sum -c -
          tar xzf "bitcoin-${V}-${ARCH}.tar.gz"
          echo "${GITHUB_WORKSPACE}/bitcoin-${V}/bin" >> "$GITHUB_PATH"

      - name: Install development tools
        run: make install-tools

      - name: Run the gate
        # Don't release a tag whose code doesn't pass the gate.
        run: make gate

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
